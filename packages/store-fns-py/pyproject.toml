[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "store-fns-py"
version = "0.1.0"
description = "L2 computed-column implementations (Python) — language-level shared layer; bound by host via core::naming normalization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
store_fns_py = ["ask_knowledge.md"]
