name: release-pypi

# 发布 storepy（纯 Python 薄 Host，import 名为 py_store）到 PyPI。
#
# 凭证：PyPI Trusted Publishing（OIDC），不使用长期 token。
# 前置（PyPI 侧一次性配置 https://pypi.org/manage/account/publishing/）：
#   PyPI Project Name = storepy
#   Owner             = coenddt
#   Repository name   = py-store
#   Workflow name     = release-pypi.yml
#   Environment name  = （留空）
#
# 注：分发名原定 `py-store`，被 PyPI 近似名规则拒绝（与已存在项目 `pystore`
#     剥离分隔符后同名），故改为 `storepy`；仓库名仍为 py-store。
#
# 触发：推 v* tag，或手动 dispatch（手动触发只构建，不发布）。
#
# 注：本包依赖 rust-store-py（同版本区间），首次发布须先发 rust-store-py，
#     否则 `pip install storepy` 会因缺依赖失败。纯 Python，wheel 为 py3-none-any。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 质量门禁（m-12）：ruff / mypy / pytest 全部通过才允许 build & publish。
  # CI 无本地外部库，需 MySQL/PG/Mongo 的 e2e 用例按测试内 skip 条件自动跳过；
  # core 走 PyPI 发布的 rust-store-py wheel（依赖随 `pip install -e .[dev]` 安装），无需 LOCAL_CORE。
  test:
    name: quality gate (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with dev extras
        run: python -m pip install -e .[dev]
      - name: Ruff check
        run: python -m ruff check src tests
      - name: Mypy check
        run: python -m mypy src/py_store
      - name: Pytest
        run: python -m pytest

  build:
    name: build sdist & wheel
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist & wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: PyPI publish (Trusted Publishing)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
