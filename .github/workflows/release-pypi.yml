name: release-pypi

# 发布 storepy（纯 Python 薄 Host，import 名为 py_store）到 PyPI。
#
# 凭证：PyPI Trusted Publishing（OIDC），不使用长期 token。
# 前置（PyPI 侧一次性配置 https://pypi.org/manage/account/publishing/）：
#   PyPI Project Name = storepy
#   Owner             = coenddt
#   Repository name   = py-store
#   Workflow name     = release-pypi.yml
#   Environment name  = （留空）
#
# 注：分发名原定 `py-store`，被 PyPI 近似名规则拒绝（与已存在项目 `pystore`
#     剥离分隔符后同名），故改为 `storepy`；仓库名仍为 py-store。
#
# 触发：推 v* tag，或手动 dispatch（手动触发只构建，不发布）。
#
# 注：本包依赖 rust-store-py（同版本区间），首次发布须先发 rust-store-py，
#     否则 `pip install storepy` 会因缺依赖失败。纯 Python，wheel 为 py3-none-any。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 质量门禁（m-12）：ruff / mypy / pytest 全部通过才允许 build & publish。
  # 环境与 ci.yml 完全对齐（同样起 MySQL/PG/Mongo 三服务 + 装全 DB extras）：
  #   - tests/test_scenario_course_platform.py 的 SQL 后端以 Mongo 产出的 oracle 对拍，
  #     缺 Mongo 时 sqlite 仍可跑却拿不到 oracle → 判定失败（不是 skip）；
  #   - tests/test_coverage_margin.py 与 tests/test_sql_commit_and_registry.py 在**收集期**
  #     即 `import aiosqlite`，缺该依赖是 collection error 而非 skip。
  # 故不能只装 `.[dev]`：v2.2.0 / v2.3.0 的 release-pypi 均因此全红（PyPI 停在 2.1.0）。
  # core 走 PyPI 发布的 rust-store-py wheel（随 extras 安装），无需 LOCAL_CORE。
  test:
    name: quality gate (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e123
          MYSQL_DATABASE: mongo_store_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e123
          POSTGRES_DB: mongo_store_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      # tests/test_scheduler.py 的 cron 对拍 fixture 单一事实源在 rust-store 仓
      # （fixtures/triggers/cases.json，双宿主共用）；actions/checkout 不允许逃逸
      # workspace，故 checkout 到 workspace 内 rust-store/，测试按候选路径探测。
      - uses: actions/checkout@v4
        with:
          repository: coenddt/rust-store
          path: rust-store
      # 工作流 T5-09（跨步骤原子回滚）依赖 MongoDB 事务：单机 mongod 须以 --replSet 启动。
      # services 的 options 是 docker create flags，容器 command 传不进去（exit 125），
      # 故用 step 内 docker run 自管 mongo 生命周期；客户端用容器内 mongosh。
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}) } catch (e) {}' && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && exit 0
            sleep 2
          done
          echo "mongo PRIMARY 未就绪" && exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 测试用独立库（real / fed）需先建库并授权；服务镜像只创建了 mongo_store_e2e
      - name: Prepare MySQL databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS mongo_store_e2e_real;
            CREATE DATABASE IF NOT EXISTS mongo_store_e2e_fed;
            GRANT ALL ON mongo_store_e2e_real.* TO 'e2e'@'%';
            GRANT ALL ON mongo_store_e2e_fed.*  TO 'e2e'@'%';
            FLUSH PRIVILEGES;"
      - name: Prepare PostgreSQL databases
        env:
          PGPASSWORD: e2e123
        run: |
          psql -h 127.0.0.1 -U e2e -d postgres -c 'CREATE DATABASE mongo_store_e2e_real';
      - name: Install with dev + db extras
        run: python -m pip install -e ".[dev,mysql,postgres,sqlite,resource]"
      - name: Ruff check
        run: python -m ruff check src tests stress
      - name: Mypy check
        run: python -m mypy src/py_store
      - name: Pytest
        run: python -m pytest

  build:
    name: build sdist & wheel
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist & wheel
        run: python -m build
      - name: Build store-fns-py (L2)
        run: python -m build packages/store-fns-py --outdir dist-storefns
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-storefns
          path: dist-storefns/*

  publish:
    name: PyPI publish (Trusted Publishing)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # 幂等：版本已存在则跳过（重跑 / tag 重指时不再撞「已存在」）
      - name: Check storepy version on PyPI
        id: core
        run: |
          V=$(basename dist/storepy-*.tar.gz | sed -E 's/^storepy-([0-9.]+)\.tar\.gz$/\1/')
          if curl -sf "https://pypi.org/pypi/storepy/$V/json" >/dev/null; then
            echo "storepy@$V 已在 PyPI，跳过发布"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: PyPI publish storepy (Trusted Publishing)
        if: steps.core.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      # L2 计算列包（独立版本，首发 0.1.0，与主包版本解耦）。
      # PyPI 尚无该项目，OIDC Trusted Publishing 需在 PyPI 侧逐项目登记，故此处走
      # account-scoped token（PYPI_API_TOKEN）；版本已存在则跳过，避免后续 tag 撞重复发布。
      - uses: actions/download-artifact@v4
        with:
          name: dist-storefns
          path: dist-storefns
      - name: Check store-fns-py version on PyPI
        id: fns
        run: |
          V=$(basename dist-storefns/store_fns_py-*.tar.gz | sed -E 's/^store_fns_py-([0-9.]+)\.tar\.gz$/\1/')
          if curl -sf "https://pypi.org/pypi/store-fns-py/$V/json" >/dev/null; then
            echo "store-fns-py@$V 已在 PyPI，跳过发布"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish store-fns-py (L2)
        if: steps.fns.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-storefns
          password: ${{ secrets.PYPI_API_TOKEN }}
