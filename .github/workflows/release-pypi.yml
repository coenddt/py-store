name: release-pypi

# 发布 py-store（纯 Python 薄 Host）到 PyPI。
#
# 凭证：PyPI Trusted Publishing（OIDC），不使用长期 token。
# 前置（PyPI 侧一次性配置 https://pypi.org/manage/account/publishing/）：
#   PyPI Project Name = py-store
#   Owner             = coenddt
#   Repository name   = py-store
#   Workflow name     = release-pypi.yml
#   Environment name  = （留空）
#
# 触发：推 v* tag，或手动 dispatch（手动触发只构建，不发布）。
#
# 注：本包依赖 rust-store-py（同版本区间），首次发布须先发 rust-store-py，
#     否则 `pip install py-store` 会因缺依赖失败。纯 Python，wheel 为 py3-none-any。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist & wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: PyPI publish (Trusted Publishing)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
